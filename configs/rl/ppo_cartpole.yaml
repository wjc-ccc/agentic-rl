# 独立的 PPO / CartPole 配置；算法尚未实现，当前仅支持 --dry-run。
# 运行：uv run python scripts/train.py --config configs/rl/ppo_cartpole.yaml --dry-run
seed: 42
device: auto
stage: rl
algo: ppo
run_name: ppo-cartpole

env:
  id: CartPole-v1
  num_envs: 4
  max_episode_steps: 500

train:
  total_steps: 100_000
  lr: 3.0e-4
  gamma: 0.99
  rollout_steps: 1024
  epochs: 10
  minibatch_size: 256
  clip_ratio: 0.2
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  checkpoint_every: 20_000

model:
  hidden_sizes: [64, 64]

eval:
  every: 5_000
  episodes: 10

logging:
  backend: swanlab
  project: sft-rl-flow
  mode: cloud  # 保留用户显式开启的 cloud；纯本地日志可改 offline
