[project]
name = "sft-rl-flow"
version = "0.1.0"
description = "Learning-oriented SFT + RL post-training flow, from tabular RL to LLM alignment."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "gymnasium>=1.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.9",
    "swanlab>=0.5",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Heavy LLM post-training stack. Install only when you reach that stage:
#   uv sync --extra llm
llm = [
    "transformers>=5.22.1,<6",
    "datasets>=3.1",
    "accelerate>=1.1",
    "peft>=0.13",
    "trl>=1.17.1,<2",
    "modelscope>=1.40.2",
]
cloud = [
    "pytrio==0.2.9",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sft", "sft.*", "rl", "rl.*"]
namespaces = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
